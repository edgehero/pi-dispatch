# The egress policy's PROXY RULES (REQ-EGRESS-ALLOWLIST). Shipped by pi-dispatch. DO NOT EDIT.
#
# The list of hosts a job may reach is NOT here. It is `egress-allowlist.conf` in your deployment
# folder, one bare hostname per line, scaffolded by `pi-dispatch init` and read by the `allowed` acl
# below. That split is deliberate: the ordering of `http_access` rules is the security property and a
# misordered one silently allows everything, so the file an operator edits contains no ordering at all.
#
# What this policy is, and is not:
#   - Hostname filtering, and exactly two shapes pass (issue #508): a CONNECT tunnel to a listed host
#     on port 443, or a plain (untunnelled) request to a listed host on port 80. Nothing else. The
#     provider, the forge and the registry are ordinary entries in the allowlist, and nothing is
#     special. The one address-based rule is a DENY: a listed name that resolves to a fixed loopback
#     or link-local address of this host is refused. Beside those, a model server you declare (issue
#     #503) is a CONNECT tunnel to its one host and port, from the include below, and nothing else.
#   - TLS is NEVER terminated. This proxy sees the name a client asks for and no byte inside the tunnel,
#     so it cannot read a credential and cannot account for a token. A proxy that decrypts provider
#     traffic is OQ-011's mechanism, a materially larger change, and it is not this.
#   - Deny by default. `http_access deny all` is the last word and every allow above it is explicit.
#
# No `access_log stdio:/dev/stdout`, and that is not an oversight: squid drops privileges to the `proxy`
# user after parsing, cannot open that path, and EXITS 1 -- after printing a clean, complete, successful
# config parse. It is the most confusing failure this file can have, so it is named here.

http_port 3128

# The operator's list. Bare hostnames, one per line; a leading dot matches subdomains (.github.com).
# `-n` (issue #428): without it squid answers an IP-literal request (CONNECT 93.184.215.14:443, or an
# IPv6 literal) that matches no entry by a REVERSE lookup of that address, and matches the name it
# gets back (measured: a PTR query per literal, then 403). A job choosing the address chooses whose
# reverse zone is asked, which is a DNS channel out. With `-n` no lookup is made: the request's host
# is compared as written, so a literal is still refused unless the list names that literal itself.
acl allowed dstdomain -n "/etc/pi-dispatch/allowlist.conf"

acl SSL_ports port 443
# Stock squid's name, narrowed to one port (issue #508). Without it `allow allowed` below let any
# tool that forwards plain HTTP (npm undici's EnvHttpProxyAgent from 8.7 on without proxyTunnel, a
# package manager, a curl -x a job brings) reach ANY port of a listed host, in clear text. What every
# job has never takes this path: pi and the runner tunnel every origin, Node 22's built-in fetch sends a
# CONNECT even for http://, and the job image's git ignores HTTP_PROXY for an http:// remote. A side
# effect: a plain forward `GET https://host/`, where this proxy would open the TLS itself, is refused
# too, since it names port 443 without a CONNECT. Measured on Docker and rootless Podman 4.9.3 and 5.8.1
# (docs/egress.md): port 8080 went from 200 to 403, port 80 stayed 200.
acl Safe_ports port 80
acl CONNECT method CONNECT

# The host's own services, by address (issue #428). On rootless Podman an account's containers.conf
# (pasta_options such as --map-host-loopback 169.254.1.2, or slirp4netns's allow_host_loopback=true,
# which answers on 10.0.2.2) gives the network this proxy sits on the host's 127.0.0.1 services, the
# job queue's Valkey among them, and a name in the allowlist that resolves (or is rebound) to one of
# these addresses would then reach them on a job's behalf. 0.0.0.0 and :: are loopback too on Linux.
# 10.0.2.2 is slirp4netns's host alias and only means the host there; elsewhere it is an ordinary
# private address, and an allowlisted service that really lives at it is refused (move it, or drop
# this entry in a copy you maintain).
# DEFENCE IN DEPTH, not the closure, and only for the FIXED addresses: the host can be mapped to any
# address (--map-host-loopback <address>, slirp4netns's cidr=, and --map-gw, which uses the default
# gateway's), and no fixed rule names those. The closure is the worker's: its podman venue refuses
# every job while the account's containers.conf sets pasta_options, network_cmd_options, annotations
# or env. That refusal reads the conf, not the live network: after a key is removed, a proxy started
# under the old conf keeps the old options until the account's containers on a bridge network restart,
# which the refusal's own text tells the operator to do.
acl to_host_local dst 127.0.0.0/8 0.0.0.0/32 169.254.0.0/16 10.0.2.2/32 ::1 ::/128 fe80::/10

# Order is the design, not a detail. Read top to bottom, first match wins.
# The deny names `allowed` FIRST, and that order is load-bearing: squid evaluates an http_access line's
# ACLs left to right and stops at the first that does not match, and `dst` resolves the requested name.
# A bare `deny to_host_local` resolved EVERY name a job asked for, listed or not (measured with
# debug_options 78,3: a CONNECT to an unlisted name sent a DNS query, where without the rule it sent
# none), which is a DNS channel out of an egress-armed job. With `allowed` first, only a listed name
# is ever resolved here, and it is the only kind the allows below could let through anyway.
# The port rule for plain requests (issue #508) sits right before the allow it narrows: first match
# wins, so after it it would never apply. It names only port and method ACLs, which resolve nothing,
# so no unlisted name is resolved by it. It never matches a CONNECT, so the tunnel rules (including a
# CONNECT allow later placed between the first two rules, see #503) are untouched by it.
http_access deny allowed to_host_local
# The declared model endpoints (issue #503): `model-endpoints.conf` in your deployment folder, rendered
# from model-endpoints.json by `pi-dispatch egress render`, empty by default. It only adds a CONNECT
# allow for each declared host and port pair, and a deny for such a host that resolves to loopback.
# It sits BEFORE the next line on purpose: pi tunnels every provider call, plain http:// included, so a
# call to a model server arrives as a CONNECT to its port, and first match wins, so the port-443 deny
# below would refuse it before any later allow was read. The file must exist (squid will not start
# without it). After a render, reload with `squid -k reconfigure` in this container, not a restart.
include /etc/pi-dispatch/model-endpoints.conf
http_access deny CONNECT !SSL_ports
http_access allow CONNECT allowed
http_access deny !Safe_ports !CONNECT
http_access allow allowed
http_access deny all

# A cache would store bytes from an allowlisted host on behalf of a container running adversarial code,
# and serve them to the next job. Nothing here wants a cache.
cache deny all
