# pi-dispatch's worker runs on the HOST, not in a container: it drives the `docker` CLI to launch
# job containers, and the CLI is what translates bind-mount paths cross-platform (Windows/macOS/
# Linux) -- see DES-WORKER-ON-HOST. That is settled doctrine, and it is why no service here mounts
# docker.sock: a socket mount is root-equivalent access to the host, and nothing in this stack needs it.
#
# The RECEIVER may run either way. It is the one internet-facing process and needs no Docker access at
# all, so a container suits it -- but the host mode (`pi-dispatch-receiver`, deploy/receiver.service)
# stays first-class. The `receiver` profile keeps the container OPT-IN: a plain `up` stays Valkey-only,
# so worker-on-host deployments that already run the receiver on the host gain no second copy.
#
#   docker compose -f deploy/docker-compose.yml up -d                     # start Valkey (default)
#   docker compose -f deploy/docker-compose.yml --profile receiver up -d  # Valkey + receiver container
#   pi-dispatch worker                                                    # drain the queue (host)

services:
  valkey:
    image: valkey/valkey:8
    # AOF on: the wait-list must survive a reboot (REQ-QUEUE-BURST-NO-DROP).
    command: valkey-server --appendonly yes
    # Bound to localhost only -- the queue is not a public surface.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - valkey-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # The containerized receiver (issue #82): the always-on webhook edge, prebuilt for amd64+arm64.
  # Build locally instead with:  docker build -f receiver/Dockerfile -t pi-dispatch-receiver .
  #
  # Relative paths below resolve against THIS FILE's directory (deploy/), not the caller's cwd --
  # that is the Compose spec for both env_file and bind mounts -- so `../` reaches the repo root
  # regardless of where `docker compose -f deploy/docker-compose.yml ...` is run from.
  receiver:
    profiles: ["receiver"]
    image: ghcr.io/edgehero/pi-dispatch-receiver:latest
    # The operator's .env at the repo root, same file the host services read (WEBHOOK_SECRET, github
    # auth, forge blocks). Compose refuses to start the profile when it is missing -- correctly: a
    # receiver without WEBHOOK_SECRET refuses to boot anyway, so fail at the clearer message.
    env_file: ../.env
    # `environment` OVERRIDES env_file, deliberately: a host .env says redis://127.0.0.1:6379, which
    # inside a container is the container itself. Service DNS is the container-side truth.
    environment:
      VALKEY_URL: redis://valkey:6379
      PI_TRIGGERS_FILE: /config/triggers.json
    # The repo-root triggers.json (`pi-dispatch init` scaffolds it -- run that first: mounting a path
    # that does not exist makes Docker create it as a DIRECTORY and the boot fails confusingly).
    # Read-only: the receiver live-reloads this file on change; it never writes it.
    volumes:
      - ../triggers.json:/config/triggers.json:ro
    # Loopback only, like Valkey's port above: the operator's reverse proxy or tunnel (TLS, public
    # hostname) is what faces the internet -- never this port raw. Assumes the in-container default
    # RECEIVER_PORT=3000; if your .env overrides it, adjust the right-hand side to match.
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      valkey:
        condition: service_healthy
    restart: unless-stopped

  # The egress policy's allowlist proxy (REQ-EGRESS-ALLOWLIST, issue #202). OPT-IN, like the receiver
  # above: a plain `up` stays Valkey-only, and a deployment that has not turned PI_EGRESS on never needs
  # this service at all.
  #
  #   docker compose -f deploy/docker-compose.yml --profile egress up -d
  #
  # It sits on ONE network here, the upstream one. The networks that matter are created by the WORKER, one
  # per job, `--internal`, and this container is attached to each for the life of that job and detached
  # after (worker/src/egress.mjs). Per-job rather than one shared network because a shared network is a
  # shared L2 segment: at DES-CONCURRENCY-3 that is three mutually-untrusting issue authors who can reach
  # each other. `enable_icc=false` cannot fix that -- ICC governs every container pair on the bridge and
  # this proxy is a container, so it would block the very path the design depends on.
  #
  # NOTHING IS PUBLISHED, deliberately. The hand-written recipe this replaces ran squid with
  # `--network host` and had to warn, in bold, to bind it to the bridge gateway, because an unbound
  # `http_port` in the host namespace is an open forward proxy on the LAN -- "a worse thing than the one
  # you set out to fix". On a docker network with no ports published, that class does not exist.
  egress-proxy:
    profiles: ["egress"]
    # Digest-pinned, and the valkey service above deliberately is NOT. A floating tag on a queue is fine:
    # a bad pull breaks loudly and spends nothing. This container IS the allowlist, so a floating tag would
    # let an upstream rebuild change what every job may reach with no commit anywhere (CONST-PI-VERSION-PINNED
    # reasoning, one vendor over). Multi-arch manifest list, so amd64 and arm64 both resolve.
    image: ubuntu/squid@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029
    # An explicit name, because the WORKER attaches this container to each job network by name and refuses
    # a job pre-spend when it is not running. Without this key compose would prefix it with the project
    # name and the two literals would disagree -- silently, and only on a deployment that renamed nothing.
    container_name: pi-dispatch-egress-proxy
    volumes:
      # The RULES, shipped and not edited. Relative paths resolve against THIS FILE's directory.
      - ./egress-proxy.conf:/etc/squid/squid.conf:ro
      # The LIST, yours. `pi-dispatch init` scaffolds it next to your .env; it is create-only, so a re-run
      # never clobbers an edited allowlist. Mounting a path that does not exist makes Docker create it as a
      # DIRECTORY and squid then fails confusingly, which is why init writes it first.
      - ../egress-allowlist.conf:/etc/pi-dispatch/allowlist.conf:ro
    networks:
      - egress-out
    restart: unless-stopped
    healthcheck:
      # Is the listener actually accepting? A squid that parsed its config and then wedged looks identical
      # to a healthy one from the outside, and `doctor` reports this where a human is reading it. The
      # pre-spend gate deliberately reads only `Running`, because a money gate must not refuse real work
      # on a signal that can flap.
      # `CMD` with an explicit bash, never `CMD-SHELL`: that form runs /bin/sh, which on this image is
      # dash, and `/dev/tcp` is a BASH feature -- under dash it fails with "Directory nonexistent" and the
      # container reports unhealthy forever while squid is serving perfectly. The image has no nc, no curl,
      # no wget and no squidclient, so bash's own socket redirection is what there is.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3128"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  # The proxy's route out. Only the proxy is ever on it: job containers live on their own per-job
  # `--internal` networks, which have no route anywhere except to this container.
  egress-out:
    name: pi-dispatch-egress-out

volumes:
  valkey-data:
