  <text x="16" y="484" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">✓ PI_PAUSE_WINDOWS_FILE=~/pi-work/pause-windows.json written into .env</tspan></text>
  <text x="16" y="503" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">✓ PI_SCOPED_LIMITS_FILE=~/pi-work/scoped-limits.json written into .env</tspan></text>
  <text x="16" y="522" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">✓ PI_LOGS_DIR=~/.pi-dispatch/logs written into .env</tspan></text>
  <text x="16" y="541" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">✓ PI_SETTINGS_FILE=~/.pi-dispatch/settings.json written into .env</tspan></text>
  <text x="16" y="560" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"></text>
  <text x="16" y="579" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">Nothing is listening on 127.0.0.1:6379. up would start Valkey (same semantics as deploy/docker-compose.yml):</tspan></text>
  <text x="16" y="598" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">  docker volume create --label com.pi-dispatch.deployment=~/pi-work pi-dispatch-valkey-data</tspan></text>
  <text x="16" y="617" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">  docker run -d --name pi-dispatch-valkey --label com.pi-dispatch.deployment=~/pi-work --restart unless-stopped -p 127</tspan></text>
  <text x="16" y="636" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">.0.0.1:6379:6379 -v pi-dispatch-valkey-data:/data -e VALKEY_PASSWORD --health-cmd 'if [ -n "${VALKEY_PASSWORD:-}" ]; t</tspan></text>
  <text x="16" y="655" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">hen REDISCLI_AUTH="$VALKEY_PASSWORD"; export REDISCLI_AUTH; fi; valkey-cli ping | grep -q PONG' --health-interval 10s </tspan></text>
  <text x="16" y="674" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">--health-timeout 3s --health-retries 5 valkey/valkey:8 sh -c 'set -eu; if [ -n "${VALKEY_PASSWORD:-}" ]; then umask 07</tspan></text>
  <text x="16" y="693" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">7; f=$(mktemp); echo "requirepass $VALKEY_PASSWORD" &gt;"$f"; exec 0&lt;"$f"; rm -f "$f"; set -- -; else set --; fi; unset V</tspan></text>
  <text x="16" y="712" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">ALKEY_PASSWORD; exec docker-entrypoint.sh valkey-server "$@" --appendonly yes'</tspan></text>
  <text x="16" y="731" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">--yes: accepted</tspan></text>
  <text x="16" y="750" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">pi-dispatch-valkey-data</tspan></text>
  <text x="16" y="769" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">482e16eeab81a455c1738de857b5fce1d1b1e7d0c6c625627ba6592ed2a6d7b1</tspan></text>
  <text x="16" y="788" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">✓ recorded pi-dispatch:owner=~/pi-work in its queue</tspan></text>
  <text x="16" y="807" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">✓ started Valkey (container pi-dispatch-valkey, AOF on, bound to 127.0.0.1, with VALKEY_PASSWORD from .env)</tspan></text>
  <text x="16" y="826" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"></text>
  <text x="16" y="845" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">The egress policy is on (PI_EGRESS=0 opts out) but the allowlist proxy is not running. up would start it (same semanti</tspan></text>
  <text x="16" y="864" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">cs as deploy/docker-compose.yml --profile egress):</tspan></text>
  <text x="16" y="883" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">  docker network create pi-dispatch-egress-out</tspan></text>
  <text x="16" y="902" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">  docker run -d --name pi-dispatch-egress-proxy --restart unless-stopped --network pi-dispatch-egress-out -v ./deploy/</tspan></text>
  <text x="16" y="921" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">egress-proxy.conf:/etc/squid/squid.conf:ro,z -v ./egress-allowlist.conf:/etc/pi-dispatch/allowlist.conf:ro,z -v ./mode</tspan></text>
  <text x="16" y="940" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">l-endpoints.conf:/etc/pi-dispatch/model-endpoints.conf:ro,z --add-host host.docker.internal:host-gateway ubuntu/squid@</tspan></text>
  <text x="16" y="959" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029</tspan></text>
  <text x="16" y="978" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">--yes: accepted</tspan></text>
  <text x="16" y="997" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">26635b56497eec0e540f0f69b7713aa0b92f9edd4a30a0da6bb4ddd556d6c242</tspan></text>
  <text x="16" y="1016" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">526e64607ba9ffea4f0a70f11115f5e56ae20017ff1188c78ff7cbc5f2043623</tspan></text>
  <text x="16" y="1035" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"></text>
  <text x="16" y="1054" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">doctor:</tspan></text>
  <text x="16" y="1073" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="rgb(110,118,129)">  … 25 doctor checks folded here: 23 ✓, 2 ⚠, no ✗ (the full report is what `pi-dispatch doctor` prints) …</tspan></text>
  <text x="16" y="1092" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"></text>
  <text x="16" y="1111" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">doctor: ready. Start the worker as the service, whose loader reads ~/pi-work/.env as doctor did: `pi-dispatch service </tspan></text>
  <text x="16" y="1130" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">install`. A worker started by hand (`pi-dispatch worker`) reads this shell's environment and not that file, so it runs</tspan></text>
  <text x="16" y="1149" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9"> without the settings doctor read from the file above unless this shell exports them.</tspan></text>
  <text x="16" y="1168" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"></text>
  <text x="16" y="1187" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">up: summary</tspan></text>
  <text x="16" y="1206" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">  job image             already present (pi-job:latest)</tspan></text>
  <text x="16" y="1225" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">  init                  ran: existing files were kept untouched, missing ones scaffolded</tspan></text>
  <text x="16" y="1244" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">  WEBHOOK_SECRET        generated into .env (value not shown; the receiver verifies deliveries with it)</tspan></text>
  <text x="16" y="1263" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">  PI_PAUSE_WINDOWS_FILE written into .env (~/pi-work/pause-windows.json)</tspan></text>
  <text x="16" y="1282" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">  PI_SCOPED_LIMITS_FILE written into .env (~/pi-work/scoped-limits.json)</tspan></text>
  <text x="16" y="1301" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">  PI_LOGS_DIR           written into .env (~/.pi-dispatch/logs)</tspan></text>
  <text x="16" y="1320" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">  PI_SETTINGS_FILE      written into .env (~/.pi-dispatch/settings.json)</tspan></text>
  <text x="16" y="1339" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">  VALKEY_PASSWORD       already set, left untouched (value not shown)</tspan></text>
  <text x="16" y="1358" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">  valkey                started container pi-dispatch-valkey (durable: --appendonly yes, restart unless-stopped)</tspan></text>
  <text x="16" y="1377" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">  egress                started pi-dispatch-egress-proxy on pi-dispatch-egress-out</tspan></text>
  <text x="16" y="1396" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"></text>
  <text x="16" y="1415" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">Next:</tspan></text>
  <text x="16" y="1434" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">  edit ~/pi-work/.env</tspan></text>
  <text x="16" y="1453" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">      set ANTHROPIC_API_KEY (or your provider's key) — already logged into pi? leave it blank</tspan></text>
  <text x="16" y="1472" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">  pi-dispatch worker</tspan></text>
  <text x="16" y="1491" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">      drain the queue (keep it running in its own terminal, or as a service)</tspan></text>
  <text x="16" y="1510" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">  pi-dispatch run ./my-project --task "add type hints to utils.py"</tspan></text>
  <text x="16" y="1529" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">      queue your first job from another terminal</tspan></text>
