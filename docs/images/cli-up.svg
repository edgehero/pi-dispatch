  <text x="16" y="256" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">created pi-packages.json         empty pi package list (stage with import-pi --with-packages)</tspan></text>
  <text x="16" y="275" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">created subscriptions.json       empty subscription list (declare plan prices for the admin's cost analytics)</tspan></text>
  <text x="16" y="294" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">created scoped-limits.json       empty scoped-limits list (per repo/folder caps; the folder mutex needs no file)</tspan></text>
  <text x="16" y="313" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">created egress-allowlist.conf    egress allowlist (provider + forge + registry; the egress policy is on unless PI_EGRE</tspan></text>
  <text x="16" y="332" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">SS=0)</tspan></text>
  <text x="16" y="351" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">created model-endpoints.json     empty model endpoints list (local or LAN model servers a job may reach through the pr</tspan></text>
  <text x="16" y="370" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">oxy)</tspan></text>
  <text x="16" y="389" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">created model-endpoints.conf     the proxy's rules for those endpoints, none yet (generated: do not edit)</tspan></text>
  <text x="16" y="408" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">created deploy/egress-proxy.conf the egress proxy's rules, the package's copy (shipped, not edited; the hosts go in th</tspan></text>
  <text x="16" y="427" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">e allowlist)</tspan></text>
  <text x="16" y="446" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"></text>
