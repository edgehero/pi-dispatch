  <text x="492" y="21" text-anchor="middle" fill="#8b949e" font-size="12" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">~/pi-work · pi-dispatch up --yes</text>
  <text x="16" y="47" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="rgb(88,166,255)">$ pi-dispatch up --yes</tspan></text>
  <text x="16" y="66" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">pi-dispatch up — one pass over the quickstart; every docker action asks first (--yes accepts)</tspan></text>
  <text x="16" y="85" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"></text>
  <text x="16" y="104" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">✓ Docker daemon reachable</tspan></text>
  <text x="16" y="123" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">✓ Job image present (pi-job:latest)</tspan></text>
  <text x="16" y="142" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"></text>
  <text x="16" y="161" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">init (never overwrites — an existing file is reported and kept):</tspan></text>
  <text x="16" y="180" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">created .env                     from .env.example, mode 0600, with a generated VALKEY_PASSWORD (value not shown): set</tspan></text>
  <text x="16" y="199" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9"> your provider key next</tspan></text>
  <text x="16" y="218" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">created triggers.json            empty triggers list</tspan></text>
