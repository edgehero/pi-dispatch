<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 984 1055" width="984" height="1055" role="img" aria-label="~/pi-work · pi-dispatch doctor">
  <rect width="984" height="1055" rx="10" fill="#0d1117" stroke="#30363d"/>
  <rect width="984" height="34" rx="10" fill="#161b22"/>
  <rect y="24" width="984" height="10" fill="#161b22"/>
  <circle cx="20" cy="17" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="17" r="6" fill="#febc2e"/>
  <circle cx="64" cy="17" r="6" fill="#28c840"/>
  <text x="492" y="21" text-anchor="middle" fill="#8b949e" font-size="12" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">~/pi-work · pi-dispatch doctor</text>
  <text x="16" y="47" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="rgb(88,166,255)">$ pi-dispatch doctor</tspan></text>
  <text x="16" y="66" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">✓ Node ≥ 22.19 (have 22.19.0)</tspan></text>
  <text x="16" y="85" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">✓ .env present</tspan></text>
  <text x="16" y="104" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">✓ service settings read from ~/pi-work/.env, as the service reads them (this shell does not set them): VALKEY_PASSWORD</tspan></text>
  <text x="16" y="123" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">, PI_JOB_IMAGE, WEBHOOK_SECRET, RECEIVER_PORT, GITLAB_URL</tspan></text>
  <text x="16" y="142" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">✓ Docker daemon reachable</tspan></text>
  <text x="16" y="161" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">✓ Job image present (pi-job:latest) -- PI_JOB_IMAGE read from ~/pi-work/.env, as the service reads it; this shell does</tspan></text>
  <text x="16" y="180" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9"> not set it</tspan></text>
  <text x="16" y="199" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">✓ Trigger skills dir present (~/pi-work/skills)</tspan></text>
  <text x="16" y="218" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">✓ Trigger skills dir holds 1 skill(s), 1 file(s)</tspan></text>
  <text x="16" y="237" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">✓ Trigger flow "fix" resolves (label trigger #0: injected run.skillsDir ~/pi-work/skills)</tspan></text>
  <text x="16" y="256" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">✓ Egress proxy running (pi-dispatch-egress-proxy)</tspan></text>
  <text x="16" y="275" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">✓ Egress proxy health: healthy</tspan></text>
  <text x="16" y="294" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">✓ Egress policy reaches the provider (api.anthropic.com answered, so the whole path works and no key was spent)</tspan></text>
  <text x="16" y="313" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">✓ Egress policy denies an unlisted host (the deny direction is the half an allowlist can silently lose)</tspan></text>
  <text x="16" y="332" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">✓ Jobs run on: local</tspan></text>
  <text x="16" y="351" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">⚠ local: nonRoot is ASSERTED by the job image's USER directive (this repo's builds `USER pi`; an operator-built image </tspan></text>
  <text x="16" y="370" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">may not), or, on a daemon that enforces bind-mount ownership with a worker uid other than 1001, the worker's own non-z</tspan></text>
  <text x="16" y="389" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">ero uid passed as `--user`, not enforced by it</tspan></text>
  <text x="16" y="408" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">    → not verifiable from here, so treat it as a claim rather than a control: the agent runs as a non-root user</tspan></text>
  <text x="16" y="427" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">✓ PI_BACKEND_FLOOR is not set, so no minimum is required of any backend</tspan></text>
  <text x="16" y="446" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">✓ local: the daemon is Docker Engine 27.5.1</tspan></text>
  <text x="16" y="465" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">✓ local: jobs run as uid:gid 1000:1000 (passed as --user) with HOME=/home/pi (a daemon that enforces bind-mount owners</tspan></text>
  <text x="16" y="484" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">hip)</tspan></text>
  <text x="16" y="503" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">✓ WEBHOOK_SECRET set -- the receiver (`pi-dispatch-receiver`) can verify deliveries</tspan></text>
  <text x="16" y="522" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">✓ github triggers take their repository from each delivery -- branch protection cannot be preflighted per repo here, a</tspan></text>
  <text x="16" y="541" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">nd is enforced per job before any spend (REQ-BRANCH-PROTECTION-PRECONDITION)</tspan></text>
  <text x="16" y="560" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">✓ GitHub auth settings read from ~/pi-work/.env, as the service reads them (this shell does not set them): GITHUB_AUTH</tspan></text>
  <text x="16" y="579" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">_SOURCE</tspan></text>
  <text x="16" y="598" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">⚠ GITHUB_AUTH_SOURCE=gh forwards your full gh login into every token-carrying job container (scopes: gist, read:org, r</tspan></text>
  <text x="16" y="617" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">epo, workflow)</tspan></text>
  <text x="16" y="636" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">    → this token carries broad scopes (workflow) -- use a fine-grained PAT (GITHUB_AUTH_SOURCE=pat) or a GitHub App fo</tspan></text>
  <text x="16" y="655" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">r per-job scoping -- see SECURITY.md</tspan></text>
  <text x="16" y="674" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">✓ gh authenticates inside the job image (pi-job:latest)</tspan></text>
  <text x="16" y="693" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">✓ Valkey reachable (redis://127.0.0.1:6379) -- VALKEY_URL read from ~/pi-work/.env, as the service reads it; this shel</tspan></text>
  <text x="16" y="712" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">l does not set it</tspan></text>
  <text x="16" y="731" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">✓ Valkey (redis://127.0.0.1:6379) requires a password, and the one this deployment sends (VALKEY_PASSWORD from ~/pi-wo</tspan></text>
  <text x="16" y="750" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">rk/.env) is accepted (the value is not shown)</tspan></text>
  <text x="16" y="769" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">✓ Provider key set (anthropic: ANTHROPIC_API_KEY) -- PI_PROVIDER and ANTHROPIC_API_KEY read from ~/pi-work/.env, as th</tspan></text>
  <text x="16" y="788" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">e service reads it; this shell does not set them</tspan></text>
  <text x="16" y="807" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">✓ PI_PAUSE_WINDOWS_FILE is set in ~/pi-work/.env (~/pi-work/pause-windows.json) and loads: the service reads that file</tspan></text>
  <text x="16" y="826" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">, this shell does not</tspan></text>
  <text x="16" y="845" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">✓ PI_SCOPED_LIMITS_FILE is set in ~/pi-work/.env (~/pi-work/scoped-limits.json) and loads: the service reads that file</tspan></text>
  <text x="16" y="864" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">, this shell does not</tspan></text>
  <text x="16" y="883" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">✓ Jobs dir /tmp/pi-dispatch-1000/jobs is this account's and writable</tspan></text>
  <text x="16" y="902" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">✓ 0 retained workspace(s) in /tmp/pi-dispatch-1000/jobs/sandboxes, swept after 24h, re-open one with `pi-dispatch sand</tspan></text>
  <text x="16" y="921" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">box &lt;jobId&gt;`</tspan></text>
  <text x="16" y="940" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">✓ Durable state: run history /home/you/.pi-dispatch/logs, settings /home/you/.pi-dispatch/settings.json — both survive</tspan></text>
  <text x="16" y="959" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9"> a reboot (docs/backup.md)</tspan></text>
  <text x="16" y="978" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"></text>
  <text x="16" y="997" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">doctor: ready. Start the worker as the service, whose loader reads ~/pi-work/.env as doctor did: `pi-dispatch service </tspan></text>
  <text x="16" y="1016" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">install`. A worker started by hand (`pi-dispatch worker`) reads this shell's environment and not that file, so it runs</tspan></text>
  <text x="16" y="1035" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9"> without the settings doctor read from the file above unless this shell exports them.</tspan></text>
</svg>
