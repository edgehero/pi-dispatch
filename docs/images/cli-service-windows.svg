  <text x="16" y="47" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="rgb(88,166,255)">PS C:\Users\you\pi-work&gt; pi-dispatch service render</tspan></text>
  <text x="16" y="66" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">The nssm sequence for this host (nssm.exe: https://nssm.cc, or `winget install nssm`):</tspan></text>
  <text x="16" y="85" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"></text>
  <text x="16" y="104" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">  nssm install pi-dispatch-worker "C:\Users\you\pi-work\node_modules\@edgehero\pi-dispatch\deploy\worker-env-wrapper.c</tspan></text>
  <text x="16" y="123" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">md" "C:\Program Files\nodejs\node.exe" "C:\Users\you\pi-work\node_modules\@edgehero\pi-dispatch\src\cli.mjs" worker</tspan></text>
  <text x="16" y="142" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">  nssm set pi-dispatch-worker AppDirectory "C:\Users\you\pi-work"</tspan></text>
  <text x="16" y="161" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">  nssm set pi-dispatch-worker AppStdout "C:\Users\you\pi-work\logs\worker.out.log"</tspan></text>
  <text x="16" y="180" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">  nssm set pi-dispatch-worker AppStderr "C:\Users\you\pi-work\logs\worker.err.log"</tspan></text>
  <text x="16" y="199" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">  nssm set pi-dispatch-worker AppStopMethodConsole 15000</tspan></text>
  <text x="16" y="218" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">  nssm set pi-dispatch-worker AppThrottle 5000</tspan></text>
  <text x="16" y="237" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">  nssm set pi-dispatch-worker AppExit Default Restart</tspan></text>
  <text x="16" y="256" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">  nssm set pi-dispatch-worker AppExit 2 Exit</tspan></text>
  <text x="16" y="275" xml:space="preserve" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9">  nssm start pi-dispatch-worker</tspan></text>
