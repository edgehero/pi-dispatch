# The egress policy's PROXY RULES (REQ-EGRESS-ALLOWLIST). Shipped by pi-dispatch. DO NOT EDIT.
#
# The list of hosts a job may reach is NOT here. It is `egress-allowlist.conf` in your deployment
# folder, one bare hostname per line, scaffolded by `pi-dispatch init` and read by the `allowed` acl
# below. That split is deliberate: the ordering of `http_access` rules is the security property and a
# misordered one silently allows everything, so the file an operator edits contains no ordering at all.
#
# What this policy is, and is not:
#   - Hostname filtering on CONNECT, to port 443 only. The provider, the forge and the registry are
#     ordinary entries in the allowlist, and nothing is special. The one address-based rule is a DENY:
#     this host's own loopback and link-local addresses are refused whatever name resolves to them.
#   - TLS is NEVER terminated. This proxy sees the name a client asks for and no byte inside the tunnel,
#     so it cannot read a credential and cannot account for a token. A proxy that decrypts provider
#     traffic is OQ-011's mechanism, a materially larger change, and it is not this.
#   - Deny by default. `http_access deny all` is the last word and every allow above it is explicit.
#
# No `access_log stdio:/dev/stdout`, and that is not an oversight: squid drops privileges to the `proxy`
# user after parsing, cannot open that path, and EXITS 1 -- after printing a clean, complete, successful
# config parse. It is the most confusing failure this file can have, so it is named here.

http_port 3128

# The operator's list. Bare hostnames, one per line; a leading dot matches subdomains (.github.com).
acl allowed dstdomain "/etc/pi-dispatch/allowlist.conf"

acl SSL_ports port 443
acl CONNECT method CONNECT

# The host's own services, by address (issue #428). On rootless Podman an account's containers.conf
# (pasta_options such as --map-host-loopback 169.254.1.2, or slirp4netns's allow_host_loopback=true,
# which answers on 10.0.2.2) gives the network this proxy sits on the host's 127.0.0.1 services, the
# job queue's Valkey among them, and a name in the allowlist that resolves (or is rebound) to one of
# these addresses would then reach them on a job's behalf. Denied BEFORE any allow, so no allowlist
# entry can reach them. 0.0.0.0 is loopback too on Linux. 10.0.2.2 is slirp4netns's host alias and
# only means the host there; elsewhere it is an ordinary private address, and an allowlisted service
# that really lives at it is refused (move it, or drop this entry in a copy you maintain).
# DEFENCE IN DEPTH, not the closure: under --map-gw pasta maps the host's default gateway address to
# its loopback, and no fixed rule here can name that address. The closure is the worker's own: its
# podman venue refuses every job while the account's containers.conf sets pasta_options,
# network_cmd_options or annotations at all, so no job runs while a proxy under that same account
# could be on a widened network.
acl to_host_local dst 127.0.0.0/8 0.0.0.0/32 169.254.0.0/16 10.0.2.2/32 ::1 fe80::/10

# Order is the design, not a detail. Read top to bottom, first match wins.
http_access deny to_host_local
http_access deny CONNECT !SSL_ports
http_access allow CONNECT allowed
http_access allow allowed
http_access deny all

# A cache would store bytes from an allowlisted host on behalf of a container running adversarial code,
# and serve them to the next job. Nothing here wants a cache.
cache deny all
