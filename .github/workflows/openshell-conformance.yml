# The `openshell` venue's conformance run (issue #683), on a real NVIDIA OpenShell gateway.
#
# `.github/scripts/openshell-conformance.mjs` builds the REAL `openshell` bundle and runs the backend conformance
# harness against it, reading the venue's properties back off a live sandbox, then runs the real job image's runner
# through it, keyed and offline. The gateway is the OpenShell release `.github/openshell.json` pins (the version the
# worker's OPENSHELL_TESTED_VERSION names, held to it by a test), installed from its checksum-pinned deb and started
# without systemd, on the Docker driver: the runner's Docker 28 and its Linux 6.x kernel with Landlock are what the
# venue needs (measured in the issue #683 lab). Issue #686 part 3 adds the `openshell-bind` venue's pass after it
# (`.github/scripts/openshell-bind-conformance.mjs`): refused on the default gateway, then the gateway restarted with
# bind mounts enabled in gateway.toml and the bind bundle read back.
#
# ADVISORY, NOT REQUIRED: the venue is not blessable until issue #684, and OpenShell is a 0.1.x vendor release whose
# gateway setup in CI is new, so a red run here is a finding to read, not a merge blocker. It is promoted to a required
# check by a later issue once it has passed across a round, as the podman lane was (issue #432). The pull_request
# trigger is unfiltered for the reason the required lanes' are, so the day it is required nothing has to change here.

name: openshell conformance

on:
  push:
    branches: [main]
    paths:
      - "worker/src/**"
      - "image/**"
      - ".github/openshell.json"
      - ".github/scripts/openshell-conformance.mjs"
      - ".github/scripts/openshell-bind-conformance.mjs"
      - ".github/workflows/openshell-conformance.yml"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conformance:
    name: the openshell venue holds its declarations
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - run: npm ci --no-audit --no-fund

      - name: The host the venue needs (Docker 28 or later, Landlock)
        run: |
          uname -r
          v=$(docker version --format '{{.Server.Version}}')
          echo "docker $v"
          [ "${v%%.*}" -ge 28 ] || { echo "Docker $v is older than OpenShell supports"; exit 2; }
          grep -q landlock /sys/kernel/security/lsm || { echo "this kernel offers no Landlock"; exit 2; }

      - name: Install the pinned OpenShell (checksum checked)
        run: |
          version=$(jq -r .version .github/openshell.json)
          file=$(jq -r .deb.amd64.file .github/openshell.json)
          sum=$(jq -r .deb.amd64.sha256 .github/openshell.json)
          curl -fsSLO "https://github.com/NVIDIA/OpenShell/releases/download/v${version}/${file}"
          echo "${sum}  ${file}" | sha256sum -c
          sudo apt-get install -y "./${file}"
          openshell --version

      # The deb's systemd user unit runs these three steps; a hosted runner has no user manager to run it in.
      - name: Start the gateway on loopback, Docker driver
        run: |
          export OPENSHELL_LOCAL_TLS_DIR="$HOME/.local/state/openshell/tls"
          mkdir -p "$OPENSHELL_LOCAL_TLS_DIR"
          openshell-gateway config preflight
          openshell-gateway generate-certs --output-dir "$OPENSHELL_LOCAL_TLS_DIR" --server-san host.openshell.internal
          OPENSHELL_COMPUTE_DRIVER=docker nohup openshell-gateway > "$RUNNER_TEMP/gateway.log" 2>&1 &
          for i in $(seq 1 60); do (echo > /dev/tcp/127.0.0.1/17670) 2>/dev/null && break; sleep 1; done
          openshell gateway add https://127.0.0.1:17670 --local --name openshell
          openshell status -o json

      - name: Build the job image
        run: docker build -f image/Dockerfile -t pi-job:ci .

      # Issue #684: a model server stand-in on the gateway host, which the generated policy reaches through OpenShell's
      # host aliases. It records what each request carried in its credential headers (only fake values reach it), so the
      # script can tell a swapped value from a placeholder, and asks git for Basic auth on info/refs.
      - name: A stand-in server on the gateway host
        run: |
          cat > "$RUNNER_TEMP/standin.mjs" <<'JS'
          import { createServer } from "node:http";
          import { appendFileSync } from "node:fs";
          createServer((req, res) => {
            appendFileSync(process.env.STANDIN_LOG, JSON.stringify({ method: req.method, path: req.url, xApiKey: req.headers["x-api-key"] ?? null, authorization: req.headers.authorization ?? null }) + "\n");
            if (req.url.includes("/info/refs") && !req.headers.authorization) {
              res.writeHead(401, { "WWW-Authenticate": 'Basic realm="standin"' });
              return res.end();
            }
            res.writeHead(200, { "content-type": "text/plain" });
            res.end("");
          }).listen(18080, "0.0.0.0");
          JS
          STANDIN_LOG="$RUNNER_TEMP/standin.jsonl" nohup node "$RUNNER_TEMP/standin.mjs" > "$RUNNER_TEMP/standin.log" 2>&1 &

      - name: Conformance (the real bundle, the real runner)
        run: STANDIN_LOG="$RUNNER_TEMP/standin.jsonl" PI_JOB_IMAGE=pi-job:ci node .github/scripts/openshell-conformance.mjs

      # Issue #686 part 3: bind mode. First on the gateway as it is, whose default settings must refuse it before spend
      # (the probe create refused with upstream's allow_driver_config sentence).
      - name: Bind mode is refused on a default gateway
        if: always()
        run: PI_JOB_IMAGE=pi-job:ci node .github/scripts/openshell-bind-conformance.mjs --default-config

      # Then the gateway restarted with the three settings bind mode needs (the lab's way: the same env, gateway.toml
      # under the runner's own config home), and the bind bundle read back off live sandboxes.
      - name: Restart the gateway with bind mounts enabled
        if: always()
        run: |
          pkill -f openshell-gateway || true
          for i in $(seq 1 30); do pgrep -f openshell-gateway >/dev/null || break; sleep 1; done
          mkdir -p "$HOME/.config/openshell"
          cat > "$HOME/.config/openshell/gateway.toml" <<'TOML'
          [openshell]
          version = 2

          [openshell.drivers.docker]
          allow_driver_config = true
          enable_bind_mounts = true

          [openshell.drivers.docker.resource_admission]
          enabled = false
          TOML
          export OPENSHELL_LOCAL_TLS_DIR="$HOME/.local/state/openshell/tls"
          OPENSHELL_COMPUTE_DRIVER=docker nohup openshell-gateway > "$RUNNER_TEMP/gateway-bind.log" 2>&1 &
          for i in $(seq 1 60); do (echo > /dev/tcp/127.0.0.1/17670) 2>/dev/null && break; sleep 1; done
          openshell status -o json

      - name: Bind-mode conformance (the real bind bundle, the real runner)
        if: always()
        run: PI_JOB_IMAGE=pi-job:ci node .github/scripts/openshell-bind-conformance.mjs

      - name: Gateway log
        if: always()
        run: |
          tail -100 "$RUNNER_TEMP/gateway.log" || true
          echo "--- after the restart with bind mounts enabled"
          tail -100 "$RUNNER_TEMP/gateway-bind.log" || true
