# The `openshell` venue's conformance run (issue #683), on a real NVIDIA OpenShell gateway.
#
# `.github/scripts/openshell-conformance.mjs` builds the REAL `openshell` bundle and runs the backend conformance
# harness against it, reading the venue's properties back off a live sandbox, then runs the real job image's runner
# through it, keyed and offline. The gateway is the OpenShell release `.github/openshell.json` pins (the version the
# worker's OPENSHELL_TESTED_VERSION names, held to it by a test), installed from its checksum-pinned deb and started
# without systemd, on the Docker driver: the runner's Docker 28 and its Linux 6.x kernel with Landlock are what the
# venue needs (measured in the issue #683 lab). Issue #686 part 3 adds the `openshell-bind` venue's pass after it
# (`.github/scripts/openshell-bind-conformance.mjs`): refused on the default gateway, then the gateway restarted with
# bind mounts enabled in gateway.toml and the bind bundle read back.
#
# ADVISORY, NOT REQUIRED: the venue is not blessable until issue #684, and OpenShell is a 0.1.x vendor release whose
# gateway setup in CI is new, so a red run here is a finding to read, not a merge blocker. It is promoted to a required
# check by a later issue once it has passed across a round, as the podman lane was (issue #432). The pull_request
# trigger is unfiltered for the reason the required lanes' are, so the day it is required nothing has to change here.

name: openshell conformance

on:
  push:
    branches: [main]
    paths:
      - "worker/src/**"
      - "image/**"
      - ".github/openshell.json"
      - ".github/scripts/openshell-conformance.mjs"
      - ".github/scripts/openshell-bind-conformance.mjs"
      - ".github/workflows/openshell-conformance.yml"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conformance:
    name: the openshell venue holds its declarations
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - run: npm ci --no-audit --no-fund

      - name: The host the venue needs (Docker 28 or later, Landlock)
        run: |
          uname -r
          v=$(docker version --format '{{.Server.Version}}')
          echo "docker $v"
          [ "${v%%.*}" -ge 28 ] || { echo "Docker $v is older than OpenShell supports"; exit 2; }
          grep -q landlock /sys/kernel/security/lsm || { echo "this kernel offers no Landlock"; exit 2; }

      - name: Install the pinned OpenShell (checksum checked)
        run: |
          version=$(jq -r .version .github/openshell.json)
          file=$(jq -r .deb.amd64.file .github/openshell.json)
          sum=$(jq -r .deb.amd64.sha256 .github/openshell.json)
          curl -fsSLO "https://github.com/NVIDIA/OpenShell/releases/download/v${version}/${file}"
          echo "${sum}  ${file}" | sha256sum -c
          sudo apt-get install -y "./${file}"
          openshell --version

      # The deb's systemd user unit runs these three steps; a hosted runner has no user manager to run it in.
      - name: Start the gateway on loopback, Docker driver
        run: |
          export OPENSHELL_LOCAL_TLS_DIR="$HOME/.local/state/openshell/tls"
          mkdir -p "$OPENSHELL_LOCAL_TLS_DIR"
          openshell-gateway config preflight
          openshell-gateway generate-certs --output-dir "$OPENSHELL_LOCAL_TLS_DIR" --server-san host.openshell.internal
          OPENSHELL_COMPUTE_DRIVER=docker nohup openshell-gateway > "$RUNNER_TEMP/gateway.log" 2>&1 &
          for i in $(seq 1 60); do (echo > /dev/tcp/127.0.0.1/17670) 2>/dev/null && break; sleep 1; done
          openshell gateway add https://127.0.0.1:17670 --local --name openshell
          openshell status -o json

      # Review round 2 of #715: `up` offers the gateway registration only where `openshell gateway list -o json` reads as
      # an empty list (an array, or `{gateways: []}`) and refuses on any other shape. Printed here, on the real 0.1.4
      # gateway with one registration, so the shape is measured: if it is neither of those, that is a finding.
      - name: The gateway list's shape (measured for issue #707)
        if: always()
        run: |
          set +e
          openshell gateway list -o json; echo "exit $?"
          openshell gateway list; echo "exit $?"

      - name: Build the job image
        run: docker build -f image/Dockerfile -t pi-job:ci .

      # Issue #684: a model server stand-in on the gateway host, which the generated policy reaches through OpenShell's
      # host aliases. It records what each request carried in its credential headers (only fake values reach it), so the
      # script can tell a swapped value from a placeholder, and asks git for Basic auth on info/refs. Issue #704 part 3:
      # its second alias (host.docker.internal) is the secret-bundle case's endpoint host, read off the same log.
      # Issue #725: it is also the steering case's model, a zero-rated OpenAI-compatible fake (`POST /v1/chat/completions`,
      # streamed). A request whose body holds no `tool` message (the run's first, or pi's retry of it) is HELD until the
      # conformance script touches STEER_SIGNAL_FILE, which it does once the relay has written the second message's
      # frame (at most 30 s, then it answers anyway and the case fails on its own assertions), and then asks for `read`
      # of the job's prompt file; any request carrying a tool result answers "done". Held on that event and not a
      # timer, so the second frame is written mid-run however slow the host; chosen by the body and not a request
      # count, so a retry is held again. The body is read, never logged: the log line stays method, path and the two
      # credential headers, as for every other route, and every other route answers exactly as before.
      - name: A stand-in server on the gateway host
        run: |
          cat > "$RUNNER_TEMP/standin.mjs" <<'JS'
          import { createServer } from "node:http";
          import { appendFileSync, existsSync } from "node:fs";
          const signalled = async () => {
            for (let waited = 0; waited < 30000 && !existsSync(process.env.STEER_SIGNAL_FILE ?? ""); waited += 100) await new Promise((r) => setTimeout(r, 100));
          };
          const completion = (req, res) => {
            let body = "";
            req.on("data", (c) => (body += c));
            req.on("end", async () => {
              let messages = [];
              try {
                messages = JSON.parse(body).messages ?? [];
              } catch {}
              const first = !messages.some((m) => m?.role === "tool");
              res.writeHead(200, { "content-type": "text/event-stream" });
              const chunk = (payload) => res.write(`data: ${JSON.stringify(payload)}\n\n`);
              const base = { id: "r", object: "chat.completion.chunk", created: 0, model: "m1" };
              const usage = { prompt_tokens: 10, completion_tokens: 3, total_tokens: 13 };
              if (first) {
                await signalled();
                chunk({ ...base, choices: [{ index: 0, delta: { role: "assistant", tool_calls: [{ index: 0, id: "call_read", type: "function", function: { name: "read", arguments: JSON.stringify({ path: "/sandbox/job/prompt.md" }) } }] }, finish_reason: null }] });
                chunk({ ...base, choices: [{ index: 0, delta: {}, finish_reason: "tool_calls" }], usage });
              } else {
                chunk({ ...base, choices: [{ index: 0, delta: { role: "assistant", content: "done" }, finish_reason: null }] });
                chunk({ ...base, choices: [{ index: 0, delta: {}, finish_reason: "stop" }], usage });
              }
              res.write("data: [DONE]\n\n");
              res.end();
            });
          };
          createServer((req, res) => {
            appendFileSync(process.env.STANDIN_LOG, JSON.stringify({ method: req.method, path: req.url, xApiKey: req.headers["x-api-key"] ?? null, authorization: req.headers.authorization ?? null }) + "\n");
            if (req.method === "POST" && req.url === "/v1/chat/completions") return completion(req, res);
            if (req.url.includes("/info/refs") && !req.headers.authorization) {
              res.writeHead(401, { "WWW-Authenticate": 'Basic realm="standin"' });
              return res.end();
            }
            res.writeHead(200, { "content-type": "text/plain" });
            res.end("");
          }).listen(18080, "0.0.0.0");
          JS
          STEER_SIGNAL_FILE="$RUNNER_TEMP/steer-second-written" STANDIN_LOG="$RUNNER_TEMP/standin.jsonl" nohup node "$RUNNER_TEMP/standin.mjs" > "$RUNNER_TEMP/standin.log" 2>&1 &

      - name: Conformance (the real bundle, the real runner)
        run: STEER_SIGNAL_FILE="$RUNNER_TEMP/steer-second-written" STANDIN_LOG="$RUNNER_TEMP/standin.jsonl" GATEWAY_LOG="$RUNNER_TEMP/gateway.log" PI_JOB_IMAGE=pi-job:ci node .github/scripts/openshell-conformance.mjs

      # Issue #686 part 3: bind mode. First on the gateway as it is, whose default settings must refuse it before spend
      # (the probe create refused with upstream's allow_driver_config sentence).
      - name: Bind mode is refused on a default gateway
        if: always()
        run: PI_JOB_IMAGE=pi-job:ci node .github/scripts/openshell-bind-conformance.mjs --default-config

      # Then the gateway restarted with the three settings bind mode needs (the lab's way: the same env, gateway.toml
      # under the runner's own config home), and the bind bundle read back off live sandboxes.
      - name: Restart the gateway with bind mounts enabled
        if: always()
        run: |
          pkill -f openshell-gateway || true
          for i in $(seq 1 30); do pgrep -f openshell-gateway >/dev/null || break; sleep 1; done
          mkdir -p "$HOME/.config/openshell"
          cat > "$HOME/.config/openshell/gateway.toml" <<'TOML'
          [openshell]
          version = 2

          [openshell.drivers.docker]
          allow_driver_config = true
          enable_bind_mounts = true

          [openshell.drivers.docker.resource_admission]
          enabled = false
          TOML
          export OPENSHELL_LOCAL_TLS_DIR="$HOME/.local/state/openshell/tls"
          OPENSHELL_COMPUTE_DRIVER=docker nohup openshell-gateway > "$RUNNER_TEMP/gateway-bind.log" 2>&1 &
          for i in $(seq 1 60); do (echo > /dev/tcp/127.0.0.1/17670) 2>/dev/null && break; sleep 1; done
          openshell status -o json

      # Issue #704 part 3: its secret-bundle case reads the stand-in's log too (the stand-in outlives the restart).
      - name: Bind-mode conformance (the real bind bundle, the real runner)
        if: always()
        run: STEER_SIGNAL_FILE="$RUNNER_TEMP/steer-second-written" STANDIN_LOG="$RUNNER_TEMP/standin.jsonl" PI_JOB_IMAGE=pi-job:ci node .github/scripts/openshell-bind-conformance.mjs

      # Issue #707: the setup commands on the real host. `pi-dispatch up --yes` in a scratch deployment folder whose .env
      # blesses only the openshell venue: the gateway is already running and registered here, so the gate reads it and
      # offers nothing; the image (pi-job:ci, built above) is found in docker's store, the gateway's engine; Valkey is
      # started on docker on a free loopback port; and no egress proxy is started, since the gateway's policy is this
      # venue's egress. Then `doctor` alone. `up` must exit 0 and doctor print no ✗ line (the venue's declared `absent`
      # properties are warnings since this issue).
      - name: up and doctor set the openshell venue up (issue #707)
        if: always()
        env:
          PI_PROVIDER: anthropic
          ANTHROPIC_API_KEY: sk-ant-ci-not-a-key
        run: |
          set -u
          dep="$RUNNER_TEMP/deploy-707"
          rm -rf "$dep" && mkdir -p "$dep"
          port=$(python3 -c 'import socket; s = socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')
          printf 'PI_BACKENDS=openshell\nVALKEY_URL=redis://127.0.0.1:%s\nPI_JOB_IMAGE=pi-job:ci\n' "$port" > "$dep/.env"
          set +e
          (cd "$dep" && node "$GITHUB_WORKSPACE/worker/src/cli.mjs" up --yes < /dev/null) > "$RUNNER_TEMP/up-707.log" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/up-707.log"
          [ "$code" -eq 0 ] || { echo "::error::pi-dispatch up --yes exited $code"; exit 1; }
          grep -q '^✓ OpenShell gateway 0\.1\.4, the tested release, on this host' "$RUNNER_TEMP/up-707.log" || { echo "::error::up did not read the gateway as ready"; exit 1; }
          if grep -q -E '^  (systemctl --user start|openshell gateway add)' "$RUNNER_TEMP/up-707.log"; then echo "::error::up offered to start or register a gateway that was already running and registered"; exit 1; fi
          docker image inspect pi-job:ci > /dev/null || { echo "::error::the job image is not in docker's store"; exit 1; }
          [ "$(docker inspect -f '{{.State.Running}}' pi-dispatch-valkey)" = "true" ] || { echo "::error::the Valkey container is not running"; exit 1; }
          docker inspect -f '{{range .HostConfig.PortBindings}}{{range .}}{{.HostPort}}{{end}}{{end}}' pi-dispatch-valkey | grep -qx "$port" || { echo "::error::Valkey is not published on VALKEY_URL's port $port"; exit 1; }
          if docker container inspect pi-dispatch-egress-proxy > /dev/null 2>&1; then echo "::error::an egress proxy container exists on an openshell-only deployment"; exit 1; fi
          set +e
          (cd "$dep" && node "$GITHUB_WORKSPACE/worker/src/cli.mjs" doctor < /dev/null) > "$RUNNER_TEMP/doctor-707.log" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/doctor-707.log"
          if grep -q '^✗' "$RUNNER_TEMP/doctor-707.log"; then echo "::error::doctor printed a ✗ line:"; grep '^✗' "$RUNNER_TEMP/doctor-707.log"; exit 1; fi
          [ "$code" -eq 0 ] || { echo "::error::doctor exited $code"; exit 1; }

      - name: Clean up the issue #707 deployment
        if: always()
        run: |
          docker rm -f pi-dispatch-valkey > /dev/null 2>&1 || true
          docker volume rm pi-dispatch-valkey-data > /dev/null 2>&1 || true
          rm -rf "$RUNNER_TEMP/deploy-707"

      - name: Gateway log
        if: always()
        run: |
          tail -100 "$RUNNER_TEMP/gateway.log" || true
          echo "--- after the restart with bind mounts enabled"
          tail -100 "$RUNNER_TEMP/gateway-bind.log" || true
